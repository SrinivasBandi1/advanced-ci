name: Run Selenium Tests

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Automation repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Selenium TestNG tests
        env:
          APP_URL: ${{ github.event.client_payload.app_url }}
          BROWSER: ${{ github.event.client_payload.browser }}
        run: |
          echo "Running tests on $APP_URL with browser $BROWSER"
          mvn test -DappUrl="$APP_URL" -Dbrowser="$BROWSER"
          mvn allure:report

      - name: Upload TestNG report
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: target/surefire-reports

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: target/site/allure-maven
